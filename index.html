<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prochains trains</title>
  <meta name="app-version" content="20261120-1609">
  <meta name="theme-color" content="#000000">
  <!-- Pour l'installation sur l'écran d'accueil de l'iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prochains trains">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261120-1609">
</head>
<body>
  <div id="app" class="app"></div>

  <dialog id="settings-dialog">
    <form method="dialog">
      <h2>Réglages</h2>
      <label for="api-key">Clé API PRIM</label>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="Colle ta clé ici">
      <p class="hint">La clé reste enregistrée sur cet appareil uniquement. Tu la trouves sur prim.iledefrance-mobilites.fr, dans « Mes jetons d'authentification ».</p>

      <h3 class="dialog-section">Mes gares</h3>
      <div class="dialog-row">
        <button type="button" class="secondary" id="export-favs">Exporter</button>
        <button type="button" class="secondary" id="import-favs">Importer</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
      <p class="hint" id="favs-status">Sauvegarde tes gares favorites dans un fichier, pour les retrouver sur un autre appareil ou après avoir réinstallé l'app.</p>
      <p class="hint version">Version <span id="app-version">—</span></p>
      <div class="dialog-actions">
        <button value="cancel" type="submit" class="secondary">Annuler</button>
        <button value="save" type="submit">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js?v=20261120-1609"></script>
</body>
</html>
